name: Validate Node
on:
  push:
    branches: [main]
    paths: ["psbbv-node.json", "schemas/**", "tests/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["psbbv-node.json", "schemas/**", "tests/**", ".github/workflows/validate.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-manifest:
    name: Validate PSBBV node contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python tests/validate_manifest.py
